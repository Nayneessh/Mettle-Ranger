name: mettle_ranger
description: "Martial-arts training log with on-camera sessions and round-boundary auto-chaptering."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # --- local store (spec §3: source of truth for the log, offline by default) ---
  drift: ^2.28.2
  drift_flutter: ^0.2.7
  path: ^1.9.0
  path_provider: ^2.1.5

  # --- state management / DI ---
  flutter_riverpod: ^2.6.1

  # --- domain UI ---
  fl_chart: ^0.70.2
  video_player: ^2.9.3
  intl: ^0.19.0

  # --- backend, opt-in (spec §5: auth + text-log backup only, never video) ---
  supabase_flutter: ^2.8.4

  # --- monetisation (spec §3, deferred behind test config until launch) ---
  google_mobile_ads: ^5.2.0
  purchases_flutter: ^8.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.7.1
  drift_dev: ^2.28.2
  flutter_lints: ^5.0.0
  # In-memory SQLite for schema/DAO tests without a device.
  sqlite3: ^2.9.0

flutter:
  uses-material-design: true

  fonts:
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
