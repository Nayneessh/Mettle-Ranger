name: CI

# Spec §6: analyze and test on every push to any branch, required to pass
# before merge to main. main is always buildable.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  # Manual-only: builds the debug APK and publishes it as a GitHub Release
  # asset rather than a 14-day Actions artifact, so it has a stable,
  # directly downloadable link. Never fires on a normal push.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.35.5'

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # Generated sources are git-ignored, so CI rebuilds them before it can
      # analyze or test anything.
      - name: Generate Drift sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart')

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --reporter expanded

  build-apk:
    name: Debug APK
    needs: analyze-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Generate Drift sources
        run: dart run build_runner build --delete-conflicting-outputs

      # Debug signing only. The release keystore is generated locally, held in
      # a password manager, and injected as a secret at release time — it is
      # never committed and is not wired up until Sprint 16 (spec §6).
      #
      # Each --dart-define below is only added when its GitHub Actions
      # secret is actually set — an unset secret must fall through to the
      # safe default lib/config/app_config.dart defines in Dart (e.g.
      # Google's public AdMob test IDs), not get overridden with an empty
      # string. No secret is ever printed: GitHub redacts a value that
      # matches a configured secret in any log output automatically.
      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_UNIT_ID: ${{ secrets.ADMOB_BANNER_UNIT_ID }}
          REVENUECAT_PUBLIC_KEY: ${{ secrets.REVENUECAT_PUBLIC_KEY }}
        run: |
          DEFINES=()
          for name in SUPABASE_URL SUPABASE_ANON_KEY ADMOB_APP_ID ADMOB_BANNER_UNIT_ID REVENUECAT_PUBLIC_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              DEFINES+=(--dart-define="$name=$value")
            fi
          done
          flutter build apk --debug "${DEFINES[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: mettle-ranger-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      # Manual-dispatch only, and a second, smaller build: --release enables
      # R8 shrinking (no minification/tree-shaking happens in --debug) and
      # --split-per-abi drops the other three architectures' native
      # libraries, together cutting a ~180MB unstripped debug APK down
      # toward something transferable. Still debug-keystore-signed (see the
      # buildTypes.release block above) — not a Play-signed release, just a
      # smaller sideloadable build for the overwhelming majority of real
      # devices (arm64-v8a).
      - name: Build a small arm64 release APK for direct download
        if: github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_UNIT_ID: ${{ secrets.ADMOB_BANNER_UNIT_ID }}
          REVENUECAT_PUBLIC_KEY: ${{ secrets.REVENUECAT_PUBLIC_KEY }}
        run: |
          DEFINES=()
          for name in SUPABASE_URL SUPABASE_ANON_KEY ADMOB_APP_ID ADMOB_BANNER_UNIT_ID REVENUECAT_PUBLIC_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              DEFINES+=(--dart-define="$name=$value")
            fi
          done
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --split-debug-info=build/debug-info --obfuscate \
            "${DEFINES[@]}"
          ls -la build/app/outputs/flutter-apk/

      # Actions artifacts live behind Azure Blob Storage, unreachable from
      # some restricted-egress environments; a Release asset is uploaded
      # straight from this runner (which has full internet access) and
      # served from GitHub's own domain, so it is fetchable from anywhere
      # that can reach github.com. Overwrites a single rolling "debug-apk"
      # tag rather than creating a new release per run.
      - name: Publish as a GitHub Release asset
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk mettle-ranger-arm64.apk
          ls -la mettle-ranger-arm64.apk
          gh release delete debug-apk --yes --cleanup-tag -R "${{ github.repository }}" || true
          gh release create debug-apk mettle-ranger-arm64.apk \
            -R "${{ github.repository }}" \
            --title "Mettle Ranger — arm64 build" \
            --notes "arm64-v8a only, R8-shrunk, debug-keystore-signed (not a Play-signed release) build from ${{ github.sha }} (branch: ${{ github.ref_name }}). See README.md for what is and isn't hardware-validated." \
            --target "${{ github.sha }}"
